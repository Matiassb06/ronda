org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# La compilacion incremental de Kotlin no puede cerrar sus caches en este
# equipo: falla con "Could not close incremental caches" en los plugins que
# traen codigo Kotlin (google_mlkit_commons, camera_android_camerax). Es un
# bloqueo de archivos de Windows, no un problema del codigo del proyecto.
# Desactivarla cuesta unos segundos de compilacion y deja la build estable.
kotlin.incremental=false
