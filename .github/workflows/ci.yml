name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    name: analyze y test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Codigo generado
        run: dart run build_runner build

      - name: Formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis estatico
        run: flutter analyze

      - name: Tests
        run: flutter test
